name: Verify Mandate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix mobile
      - run: npm run verify
      - run: npm run verify:mobile
      - name: Backend production dependency gate
        run: npm audit --omit=dev --audit-level=high --prefix backend
      - name: Web production dependency gate
        run: npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Mobile dependency gate
        run: npm audit --omit=dev --audit-level=high --prefix mobile
